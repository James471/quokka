[build-system]
requires = [
  "scikit-build-core>=0.9.0",
  "pybind11>=2.11.0",
  "cmake>=3.26",
  "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyquokka"
version = "0.1.0"
description = "Python bindings for Quokka's experimental advection prototype"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Quokka developers" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.scikit-build]
wheel.expand-macos-universal-tags = false
build.targets = ["pyquokka"]

[tool.scikit-build.cmake.define]
QUOKKA_PYTHON = "ON"
QUOKKA_BUILD_PYTHON_BINDINGS = "ON"
AMReX_SPACEDIM = "3"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
pyquokka = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
